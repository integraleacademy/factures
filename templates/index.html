<!doctype html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <meta charset="utf-8">
    <title>Dépôt de facture - Intégrale Academy</title>
</head>
<body>
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Intégrale Academy">
    <h2>Dépôt de facture</h2>

    {% if error %}
    <p style="color: #b42318; font-weight: bold;">{{ error }}</p>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        <label for="nom">Nom complet</label>
        <input type="text" id="nom" name="nom" required>

        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="numero">Numéro de facture</label>
        <input type="text" id="numero" name="numero" required>

        <label for="montant">Montant TTC</label>
        <input type="text" id="montant" name="montant" required>

        <label for="date_facture">Date de facture</label>
        <input type="date" id="date_facture" name="date_facture" required>

        <label for="fichier">Facture PDF</label>
        <input type="file" id="fichier" name="fichier" accept="application/pdf" required>

        <button type="submit">Envoyer la facture</button>
    </form>
</body>
</html>
